[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-reason"
version = "1.0.0"
authors = [
  { name="Rudra Sarker", email="rudrasarker130@gmail.com" },
]
description = "Autonomous Test-Time Compute Scaling & Dynamic KV-Cache Sparsification for Edge & Local LLMs"
readme = "README.txt"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
"Homepage" = "https://github.com/rudra496/hyper-reason"
"Bug Tracker" = "https://github.com/rudra496/hyper-reason/issues"
"Portfolio" = "https://rudra496.github.io/site"
