name: publish
# Publishes to PyPI as `hypermcts` via Trusted Publishing (OIDC) — NO token or password.
# Requires a one-time setup on pypi.org: Account → Publishing → add a pending publisher:
#   GitHub user/repo: rudra496/hyper-reason
#   workflow: .github/workflows/publish.yml   environment: pypi   project: hypermcts
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
